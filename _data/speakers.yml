- id: 3
  name: "Bhaskar Bharat"
  surname: "Sawant"
  company: "Cornerstone Building Brands"
  title: "Lead Engineer & Solutions Architect"
  bio: "Bhaskar Bharat Sawant is a Senior Software Engineer and international conference speaker who specializes in modernizing and maintaining large-scale production systems. He works extensively with enterprise platforms where legacy code, complex databases, and evolving architectures must coexist with modern cloud and AI technologies. In his day-to-day work, Bhaskar focuses on improving system reliability, reducing technical debt, and building automation that helps engineering teams manage long-lived software systems more effectively. His experience spans database-heavy applications, DevOps automation, platform engineering, and production observability. Bhaskar is an active contributor to the global developer community and regularly speaks at international conferences on topics including AI-assisted engineering, legacy system modernization, DevSecOps automation, and scalable backend architectures."
  thumbnailUrl: bhaskar-bharat-sawant.png
  rockstar: true

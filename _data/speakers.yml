- id: 2
  name: "Yoan"
  surname: "Thirion"
  company: "Pyxis Suisse"
  title: "Agile Technical Coach"
  bio: "Yoan Thirion is an agile technical coach and software crafter with 15 years of experience in software development, working for Pyxis Suisse. His different experiences in startups, small software companies, and in the service industry led him to code on a wide range of platforms and languages: mobile app development on the ancestors of our smartphones (J2ME, RIM, Windows Mobile, …), .NET stack (C#, F#, C++), PHP, Java stack (Java, Kotlin, Scala), SPA (Angular mainly). He started coaching about five years ago when he realized that he liked helping other developers and learning every day. He is an enthusiast who is always eager to learn and share with others."
